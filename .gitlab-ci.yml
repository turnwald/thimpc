image: python:3.11-slim-bookworm

stages:
  - test

variables:
  PYTHONPATH: "$CI_PROJECT_DIR"
  MPLBACKEND: "Agg"
  PIP_NO_CACHE_DIR: "1"

before_script:
  - apt-get update
  - apt-get install -y --no-install-recommends build-essential cmake gfortran liblapack-dev libblas-dev pkg-config ffmpeg git
  - rm -rf /var/lib/apt/lists/*
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements.txt

notebook_smoke:
  stage: test
  script:
    - python -m compileall plane_code projects
    - test ! -d projects/project_3_old
    - test ! -f projects/project_3_learning_safety_filter/project3_core_old.py
    - test ! -f projects/project_3_learning_safety_filter/walkthrough_old.ipynb
    - test -f projects/project_3_learning_safety_filter/assets/expert_dataset_small.npz
    - test -f projects/project_3_learning_safety_filter/assets/policy_pretrained.npz
