name: validation

on:
  push:
  pull_request:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake gfortran liblapack-dev libblas-dev pkg-config ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate current teaching material
        run: |
          python -m compileall plane_code projects
          test ! -d projects/project_3_old
          test ! -f projects/project_3_learning_safety_filter/project3_core_old.py
          test ! -f projects/project_3_learning_safety_filter/walkthrough_old.ipynb
          test -f projects/project_3_learning_safety_filter/assets/expert_dataset_small.npz
          test -f projects/project_3_learning_safety_filter/assets/policy_pretrained.npz
